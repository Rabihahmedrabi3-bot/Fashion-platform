# Render Blueprint for the fashion-platform monorepo.
#
# Deploy: push this file to your repo, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Render will create all
# five resources below in one go.
#
# Manual steps after the first deploy (env vars marked `sync: false` below
# are intentionally left blank - Render will prompt you to fill them in):
#   1. On backend-api's env vars, set:
#      - CORS_ALLOWED_ORIGINS to a comma-separated list of the
#        merchant-portal, admin-portal, and storefront URLs below
#      - BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD to a real
#        Super Admin login (not the local-dev defaults)
#      - R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
#        R2_BUCKET_NAME / R2_PUBLIC_BASE_URL to your Cloudflare R2 bucket's
#        credentials (R2 -> "Manage R2 API Tokens"; enable public access on
#        the bucket for R2_PUBLIC_BASE_URL). All uploaded images (product
#        photos, store logo, theme hero image) are stored there, not on
#        local disk - Render's free-tier filesystem is ephemeral and would
#        lose every uploaded file on redeploy/restart.
#   2. On storefront, set API_BASE_URL and NEXT_PUBLIC_API_BASE_URL to
#      backend-api's Render URL.
#   3. On merchant-portal and admin-portal, set VITE_API_BASE_URL to
#      backend-api's Render URL, then trigger a redeploy (Vite bakes this
#      in at build time, so it won't pick up a var set after the build ran).
#   4. Run once, from backend-api's Shell tab in the Render dashboard:
#        npm run db:migrate --workspace=@fashion-platform/backend-api
#        npm run db:seed --workspace=@fashion-platform/backend-api

databases:
  - name: fashion-platform-db
    databaseName: fashion_platform
    user: fashion_platform_app
    plan: free

services:
  - type: web
    name: backend-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace=@fashion-platform/shared-types && npm run build --workspace=@fashion-platform/validation --workspace=@fashion-platform/domain-shared && npm run build --workspace=@fashion-platform/backend-api
    startCommand: npm run start --workspace=@fashion-platform/backend-api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-platform-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_HASH_PEPPER
        generateValue: true
      - key: APP_BASE_DOMAIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: no-reply@example.com

  - type: web
    name: storefront
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace=@fashion-platform/shared-types && npm run build --workspace=@fashion-platform/validation --workspace=@fashion-platform/domain-shared && npm run build --workspace=@fashion-platform/storefront
    startCommand: npm run start --workspace=@fashion-platform/storefront
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: web
    name: merchant-portal
    env: static
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace=@fashion-platform/shared-types && npm run build --workspace=@fashion-platform/validation --workspace=@fashion-platform/domain-shared && npm run build --workspace=@fashion-platform/merchant-portal
    staticPublishPath: apps/merchant-portal/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: admin-portal
    env: static
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace=@fashion-platform/shared-types && npm run build --workspace=@fashion-platform/validation --workspace=@fashion-platform/domain-shared && npm run build --workspace=@fashion-platform/admin-portal
    staticPublishPath: apps/admin-portal/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
